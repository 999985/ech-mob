name: Build Android App

env:
  GOMOBILE_VERSION: v0.0.0-20260821190718-4776eadac327

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-go-aar:
    name: Build Go AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}

      - name: Initialize gomobile
        run: gomobile init

      - name: Download dependencies
        run: go mod download

      - name: Debug Go and gomobile environment
        shell: bash
        run: |
          set -euxo pipefail
          go version
          go env GOVERSION GOOS GOARCH CGO_ENABLED GOMOD GOPATH GOMODCACHE
          gomobile version || true
          go list -m -json golang.org/x/mobile
          go list -m all

      - name: Test Go core
        run: go test ./...

      - name: Build AAR
        run: |
          set -euxo pipefail
          echo "Building gomobile AAR from $(pwd)"
          test -f go.mod
          test -f workers.go
          go list -m golang.org/x/mobile
          gomobile bind -target=android \
            -androidapi=24 \
            -javapkg=com.ech.workers \
            -o ech-workers.aar \
            -v .
        env:
          CGO_ENABLED: 1

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: ech-workers-aar
          path: ech-workers.aar
          retention-days: 7

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: build-go-aar
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: ech-workers-aar
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build APKs
        run: |
          set -o pipefail
          gradle --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          find . -maxdepth 2 -type f -print | sort
          set +e
          gradle --no-daemon --stacktrace --info assembleDebug assembleRelease 2>&1 | tee gradle-build.log
          gradle_status=${PIPESTATUS[0]}
          set -e
          if [ "${gradle_status}" -ne 0 ]; then
            echo "Gradle failed with exit code ${gradle_status}; last 120 log lines:"
            tail -n 120 gradle-build.log
            diagnostic=$(
              {
                grep -E 'FAILURE:|What went wrong:|Execution failed|Could not |A problem occurred|Caused by:|error:' gradle-build.log || true
                tail -n 80 gradle-build.log
              } | tr '\n' ' ' | tr '\r' ' ' | cut -c1-60000
            )
            echo "::error title=Gradle build failure::${diagnostic}"
            exit "${gradle_status}"
          fi

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
